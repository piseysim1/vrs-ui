server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /vrms/ {
        # This points directly to the folder on disk without triggering recursive rewriting
        try_files $uri $uri/ /vrms/index.html;
    }

    location ~* \.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        etag off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|eot|ttf|woff|woff2)$ {
        expires 365d;
        access_log off;
        add_header Access-Control-Allow-Origin *;
    }
}